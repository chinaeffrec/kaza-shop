x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # порт НЕ exposed наружу
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
      - ./data:/app/data
    env_file: .env
    environment:
      - ENV=production
      - CORS_ORIGINS=https://${DOMAIN}   # задаётся в .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaza_shop_bot
    restart: always
    logging: *default-logging
    env_file: .env
    command: python -m app.bot.bot
    environment:
      - ENV=production
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  seller:
    build:
      context: ./seller-panel
      dockerfile: Dockerfile
    container_name: kaza_seller_panel
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./seller-panel:/app
      - seller_node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  seller_node_modules: