[settings]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

known_first_party = app
known_third_party =
    fastapi
    uvicorn
    sqlalchemy
    aiogram
    httpx
    pandas
    openpyxl
    python_multipart
    aiofiles
    aiohttp
    reportlab
    pydantic
    starlette

sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER