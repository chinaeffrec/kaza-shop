services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./app/media:/app/app/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaza_shop_bot
    restart: always
    env_file: .env
    command: python -m app.bot.bot
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  seller:
    build:
      context: ./seller-panel
      dockerfile: Dockerfile
    container_name: kaza_seller_panel
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    # Монтируем весь seller-panel, node_modules берём из образа (не перезаписываем)
    volumes:
      - ./seller-panel:/app
      - seller_node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  seller_node_modules:
